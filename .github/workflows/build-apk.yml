name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Extract project from zip
        run: |
          mkdir -p extracted
          for z in *.zip; do unzip -o "$z" -d extracted; done
          if [ -f extracted/settings.gradle.kts ]; then
            echo "PROJECT_DIR=extracted" >> $GITHUB_ENV
          else
            d=$(dirname $(find extracted -name settings.gradle.kts | head -1))
            echo "PROJECT_DIR=$d" >> $GITHUB_ENV
          fi
      - name: Build Debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: makhzani-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
